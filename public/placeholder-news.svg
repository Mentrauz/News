<svg width="1200" height="600" viewBox="0 0 1200 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="600" fill="#f3f4f6"/>
  <rect x="50" y="50" width="1100" height="500" rx="8" fill="#e5e7eb" stroke="#d1d5db" stroke-width="2"/>
  
  <!-- Newspaper icon -->
  <g transform="translate(550, 250)">
    <rect x="0" y="0" width="100" height="80" rx="4" fill="#9ca3af" stroke="#6b7280" stroke-width="2"/>
    <rect x="10" y="15" width="80" height="8" fill="#6b7280"/>
    <rect x="10" y="30" width="60" height="4" fill="#9ca3af"/>
    <rect x="10" y="40" width="70" height="4" fill="#9ca3af"/>
    <rect x="10" y="50" width="50" height="4" fill="#9ca3af"/>
    <rect x="10" y="60" width="65" height="4" fill="#9ca3af"/>
  </g>
  
  <!-- "News Image" text -->
  <text x="600" y="380" text-anchor="middle" fill="#6b7280" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="500">
    News Image Placeholder
  </text>
  
  <!-- Dimensions text -->
  <text x="600" y="410" text-anchor="middle" fill="#9ca3af" font-family="system-ui, -apple-system, sans-serif" font-size="16">
