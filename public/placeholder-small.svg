<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="300" fill="#f3f4f6"/>
  <rect x="20" y="20" width="360" height="260" rx="6" fill="#e5e7eb" stroke="#d1d5db" stroke-width="1"/>
  
  <!-- Small newspaper icon -->
  <g transform="translate(175, 120)">
    <rect x="0" y="0" width="50" height="40" rx="2" fill="#9ca3af" stroke="#6b7280" stroke-width="1"/>
    <rect x="5" y="8" width="40" height="4" fill="#6b7280"/>
    <rect x="5" y="16" width="30" height="2" fill="#9ca3af"/>
    <rect x="5" y="20" width="35" height="2" fill="#9ca3af"/>
    <rect x="5" y="24" width="25" height="2" fill="#9ca3af"/>
    <rect x="5" y="28" width="32" height="2" fill="#9ca3af"/>
  </g>
  
  <!-- "Image" text -->
  <text x="200" y="190" text-anchor="middle" fill="#6b7280" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500">
    Image Placeholder
  </text>
  
  <!-- Dimensions text -->
  <text x="200" y="210" text-anchor="middle" fill="#9ca3af" font-family="system-ui, -apple-system, sans-serif" font-size="12">
    400 × 300
  </text>
</svg> 